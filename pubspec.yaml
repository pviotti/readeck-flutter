name: readeck
description: "Readeck application, for managing your reading list"
publish_to: 'none'
version: 0.3.1+1

environment:
  sdk: ^3.11.1

dependencies:
  app_links: ^7.0.0
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html: ^0.17.2
  flutter_tts: ^4.2.2
  html: ^0.15.6
  http: ^1.3.0
  path_provider: ^2.1.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon/readeck-icon.png
  adaptive_icon_background: "#064C5C"
  adaptive_icon_foreground: assets/icon/readeck-icon.png
  min_sdk_android: 21
