name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: 3.41.4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: readeck-linux
          path: build/linux/x64/release/bundle/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          {
            printf 'storeFile=release-key.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android debug APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: readeck-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build Android release APK
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')
        run: flutter build apk --release --split-per-abi

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')
        with:
          name: readeck-android-release
          path: build/app/outputs/flutter-apk/app-*-release.apk

  release-draft:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [build-linux, build-android]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          tar -czf readeck-linux.tar.gz -C artifacts/readeck-linux .
          for apk in artifacts/readeck-android-release/app-*-release.apk; do
            cp "$apk" "readeck-android-$(basename "$apk" | sed 's/^app-//')"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | awk '{print $1}')
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            --repo "$GITHUB_REPOSITORY" readeck-linux.tar.gz readeck-android-*-release.apk
